<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://galeriadaservas.com.br/dashboard/">
  <title>Painel | Galeria das Ervas</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
    .panel-frame{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#fff}
    .loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#fff;transition:opacity .35s ease,visibility .35s ease}
    .loading.done{opacity:0;visibility:hidden;pointer-events:none}
    .loading img{display:block;width:min(270px,68vw);height:110px;object-fit:contain}
    .loading span{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));font:500 12px/1.4 Arial,sans-serif;color:#747b75}
  </style>
</head>
<body>
  <div id="loading" class="loading" aria-live="polite">
    <img src="../assets/img/site/logo.png" alt="Galeria das Ervas">
    <span>Carregando painel…</span>
  </div>
  <iframe
    id="panelFrame"
    class="panel-frame"
    title="Painel administrativo da Galeria das Ervas"
    src="https://script.google.com/macros/s/AKfycbw7WeLFouCEpLG21BaONzKG3Cj4M_5R0CkVr4WI0JbPlSoyyjLkqGNi0pYCrC9HoZ91/exec"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <script>
    const loading=document.getElementById('loading');
    document.getElementById('panelFrame').addEventListener('load',()=>loading.classList.add('done'));
  </script>
</body>
</html>
