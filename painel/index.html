<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Painel administrativo da Galeria das Ervas">
  <meta name="application-name" content="Painel | Galeria das Ervas">
  <meta name="theme-color" content="#1a7b3b">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Painel">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/site/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/painel/icons/apple-touch-icon.png">
  <link rel="canonical" href="https://galeriadaservas.com.br/painel/">
  <title>Painel | Galeria das Ervas</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
    .panel-frame{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#fff}
    .loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#fff;transition:opacity .34s ease,visibility 0s linear .34s}
    .loading.done{opacity:0;visibility:hidden;pointer-events:none}
    .loading img{position:fixed;left:50%;top:50%;display:block;width:min(270px,68vw);height:auto;object-fit:contain;transform:translate(-50%,-50%);filter:drop-shadow(0 12px 28px rgba(29,78,43,.08));transition:left .9s cubic-bezier(.22,1,.36,1),top .9s cubic-bezier(.22,1,.36,1),width .9s cubic-bezier(.22,1,.36,1),height .9s cubic-bezier(.22,1,.36,1),filter .7s ease;will-change:left,top,width,height}
    .loading.handoff img{filter:drop-shadow(0 8px 18px rgba(29,78,43,0))}
    .loading span{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));font:500 12px/1.4 Arial,sans-serif;color:#747b75;transition:opacity .24s ease}
    .loading.handoff span{opacity:0}
    .offline-state{position:fixed;inset:0;z-index:4;display:grid;place-items:center;padding:24px;background:#fff;color:#172019;font-family:Arial,sans-serif;text-align:center}
    .offline-state[hidden]{display:none}
    .offline-card{width:min(420px,100%);display:grid;justify-items:center;gap:14px}
    .offline-card img{display:block;width:132px;height:132px;object-fit:contain;margin-bottom:6px}
    .offline-card h1{margin:0;font-size:25px;line-height:1.15;letter-spacing:-.03em}
    .offline-card p{max-width:340px;margin:0;color:#687068;font-size:14px;line-height:1.55}
    .offline-card button{min-width:190px;min-height:48px;margin-top:8px;padding:12px 20px;border:0;border-radius:999px;background:#18b834;color:#fff;font:700 14px/1 Arial,sans-serif;cursor:pointer}
    .offline-card button:focus-visible{outline:3px solid rgba(24,184,52,.28);outline-offset:3px}
    body.is-offline .loading,body.is-offline .panel-frame{visibility:hidden}
    @media(max-width:520px){.loading img{width:min(260px,72vw)}}
    @media(prefers-reduced-motion:reduce){.loading img,.loading{transition-duration:.01ms!important;transition-delay:0s!important}}
  </style>
</head>
<body>
  <div id="loading" class="loading" aria-live="polite">
    <img src="../assets/img/site/logo.png" alt="Galeria das Ervas">
    <span>Carregando painel…</span>
  </div>
  <section id="offlineState" class="offline-state" aria-live="polite" hidden>
    <div class="offline-card">
      <img src="/assets/img/site/favicon-192.png" alt="">
      <h1>Você está sem conexão</h1>
      <p>O painel precisa de internet para acessar e salvar os dados da Galeria das Ervas.</p>
      <button id="retryButton" type="button">Tentar novamente</button>
    </div>
  </section>
  <iframe
    id="panelFrame"
    class="panel-frame"
    title="Painel administrativo da Galeria das Ervas"
    src="https://script.google.com/macros/s/AKfycbw7WeLFouCEpLG21BaONzKG3Cj4M_5R0CkVr4WI0JbPlSoyyjLkqGNi0pYCrC9HoZ91/exec"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <script>
    const loading=document.getElementById('loading');
    const panelFrame=document.getElementById('panelFrame');
    const loadingLogo=loading.querySelector('img');
    const offlineState=document.getElementById('offlineState');
    const retryButton=document.getElementById('retryButton');
    let handoffStarted=false;
    let fallbackTimer=0;

    function setConnectionState(offline){
      document.body.classList.toggle('is-offline',offline);
      offlineState.hidden=!offline;
      if(offline) loading.classList.add('done');
      return offline;
    }

    function syncConnectionState(){
      return setConnectionState(!navigator.onLine);
    }

    async function verifyPanelConnection(){
      if(syncConnectionState()) return false;
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),6000);
      try{
        await fetch(panelFrame.src,{mode:'no-cors',cache:'no-store',signal:controller.signal});
        setConnectionState(false);
        return true;
      }catch(error){
        setConnectionState(true);
        return false;
      }finally{
        clearTimeout(timeout);
      }
    }

    retryButton.addEventListener('click',async()=>{
      retryButton.disabled=true;
      const reachable=await verifyPanelConnection();
      retryButton.disabled=false;
      if(reachable) window.location.reload();
    });
    window.addEventListener('offline',syncConnectionState);
    window.addEventListener('online',verifyPanelConnection);
    syncConnectionState();
    verifyPanelConnection();

    function validLoginRect(rect){
      return rect&&[rect.left,rect.top,rect.width,rect.height].every(Number.isFinite)&&rect.width>80&&rect.height>50;
    }

    function beginExactHandoff(data,source){
      if(handoffStarted||!validLoginRect(data.rect)) return;
      if(!loadingLogo.complete){
        loadingLogo.addEventListener('load',()=>beginExactHandoff(data,source),{once:true});
        return;
      }
      handoffStarted=true;
      clearTimeout(fallbackTimer);
      const start=loadingLogo.getBoundingClientRect();
      const sourceViewport=data.viewport||{};
      const ratioX=sourceViewport.width>0?window.innerWidth/sourceViewport.width:1;
      const ratioY=sourceViewport.height>0?window.innerHeight/sourceViewport.height:1;
      const target={
        left:data.rect.left*ratioX,
        top:data.rect.top*ratioY,
        width:data.rect.width*ratioX,
        height:data.rect.height*ratioY
      };
      Object.assign(loadingLogo.style,{
        left:start.left+'px',top:start.top+'px',width:start.width+'px',height:start.height+'px',transform:'none'
      });
      loadingLogo.getBoundingClientRect();
      requestAnimationFrame(()=>{
        loading.classList.add('handoff');
        Object.assign(loadingLogo.style,{
          left:target.left+'px',top:target.top+'px',width:target.width+'px',height:target.height+'px'
        });
      });
      setTimeout(()=>source?.postMessage({type:'gde-login-reveal'},'*'),820);
      setTimeout(()=>loading.classList.add('done'),920);
    }

    window.addEventListener('message',event=>{
      const data=event.data;
      if(data?.type!=='gde-login-target') return;
      let host='';
      try{host=new URL(event.origin).hostname}catch(error){return}
      if(host!=='script.google.com'&&!host.endsWith('script.googleusercontent.com')) return;
      beginExactHandoff(data,event.source);
    });

    panelFrame.addEventListener('load',()=>{
      if(syncConnectionState()) return;
      fallbackTimer=setTimeout(()=>{
        if(handoffStarted) return;
        loading.classList.add('handoff');
        setTimeout(()=>loading.classList.add('done'),360);
      },2600);
    });

    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>{
        navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'})
          .catch(error=>console.error('[Galeria das Ervas PWA] Falha ao registrar o service worker:',error));
      });
    }
  </script>
</body>
</html>
