<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a7b3b">
  <meta name="robots" content="noindex,nofollow">
  <title>Sem conexão | Painel Galeria das Ervas</title>
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0;background:#fff;color:#172019;font-family:Arial,sans-serif}
    body{display:grid;place-items:center;padding:24px;text-align:center}
    main{width:min(420px,100%);display:grid;justify-items:center;gap:14px}
    img{display:block;width:132px;height:132px;object-fit:contain;margin-bottom:6px}
    h1{margin:0;font-size:25px;line-height:1.15;letter-spacing:-.03em}
    p{max-width:340px;margin:0;color:#687068;font-size:14px;line-height:1.55}
    button{min-width:190px;min-height:48px;margin-top:8px;padding:12px 20px;border:0;border-radius:999px;background:#18b834;color:#fff;font:700 14px/1 Arial,sans-serif;cursor:pointer}
    button:focus-visible{outline:3px solid rgba(24,184,52,.28);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/site/favicon-192.png" alt="">
    <h1>Você está sem conexão</h1>
    <p>O painel precisa de internet para acessar e salvar os dados da Galeria das Ervas.</p>
    <button type="button" onclick="window.location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
